[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-contract"
version = "0.1.0"
description = "Schema-first structured extraction for LLM APIs, with feedback retries and an eval harness."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]

[tool.setuptools.packages.find]
include = ["llm_contract*"]
